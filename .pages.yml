media: public/uploads

content:
  - name: posts
    label: Blog Posts
    type: collection
    path: src/posts
    filename: "{year}-{month}-{day}-{primary}.qmd"
    extension: qmd
    format: yaml-frontmatter
    view:
      fields: [title, date, featured]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: description, label: Description, type: text }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: readTime, label: Read Time, type: string }
      - { name: featured, label: Featured, type: boolean, default: false }
      - { name: slug, label: Slug, type: string, required: true }
      - { name: body, label: Body, type: rich-text }

  - name: profiles
    label: Team Profiles
    type: collection
    path: src/profiles
    extension: qmd
    format: yaml-frontmatter
    view:
      fields: [name, position]
      primary: name
    fields:
      - { name: id, label: ID (slug), type: string, required: true }
      - { name: name, label: Name, type: string, required: true }
      - { name: position, label: Position, type: string }
      - { name: image, label: Photo, type: image }
      - { name: email, label: Email, type: string }
      - { name: bio, label: Short Bio, type: text }
      - { name: researchInterests, label: Research Interests, type: string, list: true }
      - { name: education, label: Education, type: string, list: true }
      - { name: awards, label: Awards, type: string, list: true }
      - name: socialLinks
        label: Social Links
        type: object
        fields:
          - { name: linkedin, label: LinkedIn URL, type: string }
          - { name: google_scholar, label: Google Scholar URL, type: string }
          - { name: orcid, label: ORCID URL, type: string }
      - { name: body, label: Extended Bio, type: rich-text }

  - name: projects
    label: Research Projects
    type: collection
    path: src/projects
    extension: qmd
    format: yaml-frontmatter
    view:
      fields: [title, status, featured]
      primary: title
    fields:
      - { name: id, label: ID (slug), type: string, required: true }
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Short Description, type: text }
      - name: status
        label: Status
        type: select
        options:
          values: [ongoing, completed, planned]
      - { name: startDate, label: Start Date, type: date }
      - { name: endDate, label: End Date, type: date }
      - { name: funding, label: Funding, type: string }
      - { name: technologies, label: Technologies, type: string, list: true }
      - { name: collaborators, label: Collaborators, type: string, list: true }
      - { name: team, label: Team Member IDs, type: string, list: true }
      - { name: image, label: Image, type: image }
      - { name: featured, label: Featured, type: boolean, default: false }
      - { name: body, label: Project Details, type: rich-text }

  # ---------- Content singletons (one form per file) ----------

  - name: about
    label: About / PI Bio
    type: file
    path: src/content/about.qmd
    format: yaml-frontmatter
    fields:
      - { name: title, label: Title, type: string }
      - { name: position, label: Position, type: string }
      - { name: department, label: Department, type: string }
      - { name: institution, label: Institution, type: string }
      - { name: email, label: Email, type: string }
      - { name: phone, label: Phone, type: string }
      - { name: office, label: Office, type: string }
      - { name: body, label: Bio & Research Description, type: rich-text }

  - name: laboratory-vision
    label: Laboratory Vision
    type: file
    path: src/content/laboratory-vision.qmd
    format: yaml-frontmatter
    fields:
      - { name: title, label: Title, type: string }
      - { name: description, label: Description, type: text }
      - { name: lastUpdated, label: Last Updated, type: date }
      - { name: body, label: Body, type: rich-text }

  - name: publications-page
    label: Publications Page
    type: file
    path: src/content/publications.qmd
    format: yaml-frontmatter
    fields:
      - { name: title, label: Title, type: string }
      - { name: description, label: Description, type: text }
      - { name: totalPublications, label: Total Publications, type: number }
      - { name: hIndex, label: h-Index, type: number }
      - { name: lastUpdated, label: Last Updated, type: date }
      - { name: body, label: Body, type: rich-text }

  - name: collaborations-page
    label: Collaborations Page
    type: file
    path: src/content/collaborations.qmd
    format: yaml-frontmatter
    fields:
      - { name: title, label: Title, type: string }
      - { name: description, label: Description, type: text }
      - { name: lastUpdated, label: Last Updated, type: date }
      - { name: body, label: Body, type: rich-text }

  - name: resources-page
    label: Resources Page
    type: file
    path: src/content/resources.qmd
    format: yaml-frontmatter
    fields:
      - { name: title, label: Title, type: string }
      - { name: description, label: Description, type: text }
      - { name: lastUpdated, label: Last Updated, type: date }
      - { name: body, label: Body, type: rich-text }

  - name: research-group-page
    label: Research Group Page
    type: file
    path: src/content/research-group.qmd
    format: yaml-frontmatter
    fields:
      - { name: title, label: Title, type: string }
      - { name: description, label: Description, type: text }
      - { name: lastUpdated, label: Last Updated, type: date }
      - { name: body, label: Body, type: rich-text }

  # ---------- Site-wide settings (YAML singletons) ----------

  - name: hero
    label: Homepage Hero
    type: file
    path: src/content/hero.yml
    format: yaml
    fields:
      - { name: headline, label: Headline, type: string }
      - { name: highlight, label: Highlighted Text, type: string }
      - { name: tagline, label: Tagline, type: text }

  - name: site-config
    label: Site Settings
    type: file
    path: src/content/site-config.yml
    format: yaml
    fields:
      - { name: siteName, label: Site Name, type: string }
      - { name: siteFullName, label: Full Lab Name / Footer Description, type: text }
      - { name: copyright, label: Copyright Notice, type: string }
      - { name: footerNote, label: Footer Note, type: string }
      - { name: footerResearchAreas, label: Footer Research Areas, type: string, list: true }
      - name: quickLinks
        label: Quick Links
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: href, label: URL, type: string }

  - name: research-lines
    label: Research Lines
    type: collection
    path: src/research-lines
    extension: yml
    format: yaml
    view:
      fields: [title, order]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: order, label: Display Order, type: number }
      - { name: description, label: Description, type: text }
      - { name: technologies, label: Technologies, type: string, list: true }